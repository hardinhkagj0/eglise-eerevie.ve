<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grande Veillée de Prière - Église EEREVIE</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 15px;
      text-align: center;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .poster {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 0;
      margin: 12px 0;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 10px;
      box-sizing: border-box;
    }
    .btn-yango {
      background-color: #ffcc00;
      color: #000000;
    }
    .btn-maps {
      background-color: #27ae60;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Image de l'affiche -->
    <img src="affiche-veillee.png" alt="Affiche Grande Veillée" class="poster">

    <!-- Bouton Yango -->
    <a class="btn btn-yango" href="https://yango.com/adj/yango?end-lon=-4.05507&end-lat=5.3545" target="_blank">
      🚖 COMMANDER UNE COURSE YANGO
    </a>

    <!-- Bouton Google Maps -->
    <a class="btn btn-maps" href="https://www.google.com/maps/search/?api=1&query=5.3545,-4.05507" target="_blank">
      📍 VOIR L'ITINÉRAIRE SUR GOOGLE MAPS
    </a>
  </div>

</body>
</html>
